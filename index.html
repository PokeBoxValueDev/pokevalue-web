<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeValue - Calculadora de Cajas</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen pb-10">

    <div class="max-w-xl mx-auto px-4 py-8">
        <!-- Header -->
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-indigo-600">PokeValue Web</h1>
            <p id="last-updated" class="text-xs text-gray-500 mt-1">Cargando fecha de actualización...</p>
        </header>

        <!-- Formulario -->
        <main class="bg-white rounded-2xl shadow-md p-6 space-y-6">
            
            <!-- Precio de la caja -->
            <div>
                <label for="box-price" class="block text-sm font-semibold text-gray-700 mb-1">Precio de la Caja (€)</label>
                <input type="number" step="0.01" id="box-price" placeholder="Ej: 8.99" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- Lista de Objetos -->
            <div>
                <h2 class="text-sm font-semibold text-gray-700 mb-3">Objetos incluidos</h2>
                <div id="items-container" class="space-y-3">
                    <p class="text-sm text-gray-400">Cargando objetos desde GitHub...</p>
                </div>
            </div>

            <!-- Botón de calcular -->
            <button onclick="calculate()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition">
                Calcular Rentabilidad
            </button>

            <!-- Resultado -->
            <div id="result-box" class="hidden p-4 rounded-xl text-center space-y-2">
                <h3 id="result-title" class="text-lg font-bold"></h3>
                <div class="flex justify-between text-sm pt-2 border-t border-white/20">
                    <div>
                        <p class="opacity-80">Precio caja:</p>
                        <p id="res-box-price" class="font-semibold"></p>
                    </div>
                    <div>
                        <p class="opacity-80">Valor real:</p>
                        <p id="res-real-value" class="font-semibold"></p>
                    </div>
                    <div>
                        <p id="res-diff-label" class="opacity-80">Diferencia:</p>
                        <p id="res-diff-val" class="font-semibold"></p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        const JSON_URL = 'https://raw.githubusercontent.com/alejandrrolc/pokevalue-data/main/items.json';
        let storeData = [];

        // Cargar JSON
        async function fetchStoreData() {
            try {
                const response = await fetch(JSON_URL);
                const data = await response.json();
                storeData = data.objetos;
                document.getElementById('last-updated').innerText = `Precios actualizados el: ${data.last_updated}`;
                renderItems();
            } catch (error) {
                document.getElementById('items-container').innerHTML = `<p class="text-red-500 text-sm">Error al cargar datos.</p>`;
            }
        }

        // Renderizar lista con inputs de cantidad
        function renderItems() {
            const container = document.getElementById('items-container');
            container.innerHTML = '';

            storeData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-100';
                div.innerHTML = `
                    <div>
                        <p class="font-medium text-sm text-gray-800">${item.name}</p>
                        <p class="text-xs text-gray-400">Unidad: ${item.unit_price_eur.toFixed(2)} €</p>
                    </div>
                    <input type="number" min="0" value="0" data-id="${item.id}" class="item-qty w-16 px-2 py-1 border border-gray-300 rounded-md text-center text-sm font-semibold focus:ring-1 focus:ring-indigo-500">
                `;
                container.appendChild(div);
            });
        }

        // Calcular
        function calculate() {
            const boxPrice = parseFloat(document.getElementById('box-price').value);
            if (isNaN(boxPrice) || boxPrice <= 0) {
                alert("Introduce un precio válido para la caja.");
                return;
            }

            let totalValue = 0;
            const qtyInputs = document.querySelectorAll('.item-qty');
            
            qtyInputs.forEach(input => {
                const qty = parseInt(input.value) || 0;
                const itemId = input.getAttribute('data-id');
                const item = storeData.find(i => i.id === itemId);
                if (item && qty > 0) {
                    totalValue += item.unit_price_eur * qty;
                }
            });

            const diff = totalValue - boxPrice;
            const isProfitable = diff > 0;

            const resBox = document.getElementById('result-box');
            resBox.classList.remove('hidden', 'bg-emerald-500', 'bg-rose-500', 'text-white');
            resBox.classList.add(isProfitable ? 'bg-emerald-500' : 'bg-rose-500', 'text-white');

            document.getElementById('result-title').innerText = isProfitable ? "¡OFERTA RENTABLE! 🎉" : "NO VALE LA PENA ❌";
            document.getElementById('res-box-price').innerText = boxPrice.toFixed(2) + " €";
            document.getElementById('res-real-value').innerText = totalValue.toFixed(2) + " €";
            document.getElementById('res-diff-label').innerText = isProfitable ? "Ahorras:" : "Pierdes:";
            document.getElementById('res-diff-val').innerText = Math.abs(diff).toFixed(2) + " €";
        }

        fetchStoreData();
    </script>
</body>
</html>
