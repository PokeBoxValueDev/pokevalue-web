<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeValue - Calculadora de Cajas</title>
    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen pb-10">

    <div class="max-w-xl mx-auto px-4 py-8">
        <!-- Header fijo -->
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-indigo-600">PokeValue Web</h1>
            <p id="last-updated" class="text-xs text-gray-500 mt-1">Cargando fecha de actualización...</p>
        </header>

        <!-- VISTA 1: FORMULARIO DE CÁLCULO -->
        <section id="view-form" class="bg-white rounded-2xl shadow-md p-6 space-y-6">
            <!-- Precio de la caja -->
            <div>
                <label for="box-price" class="block text-sm font-semibold text-gray-700 mb-1">Precio de la Caja (€)</label>
                <input type="number" step="0.01" id="box-price" placeholder="Ej: 8.99" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- Lista de Objetos -->
            <div>
                <h2 class="text-sm font-semibold text-gray-700 mb-3">Objetos incluidos</h2>
                <div id="items-container" class="space-y-3">
                    <p class="text-sm text-gray-400">Cargando objetos desde GitHub...</p>
                </div>
            </div>

            <!-- Botón de calcular -->
            <button onclick="calculate()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition">
                Calcular Rentabilidad
            </button>
        </section>

        <!-- VISTA 2: RESULTADO DE EVALUACIÓN (Oculta por defecto) -->
        <section id="view-result" class="hidden bg-white rounded-2xl shadow-md p-6 space-y-6">
            
            <div id="result-card" class="p-6 rounded-xl text-center space-y-4">
                <h3 id="result-title" class="text-2xl font-bold"></h3>
                
                <div class="grid grid-cols-3 gap-2 pt-4 border-t border-white/20 text-sm">
                    <div>
                        <p class="opacity-80 text-xs">Precio caja</p>
                        <p id="res-box-price" class="font-bold text-base mt-1"></p>
                    </div>
                    <div>
                        <p class="opacity-80 text-xs">Valor real</p>
                        <p id="res-real-value" class="font-bold text-base mt-1"></p>
                    </div>
                    <div>
                        <p id="res-diff-label" class="opacity-80 text-xs">Diferencia</p>
                        <p id="res-diff-val" class="font-bold text-base mt-1"></p>
                    </div>
                </div>
            </div>

            <!-- Botón para volver a calcular -->
            <button onclick="resetCalculator()" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-semibold py-3 rounded-xl transition">
                Calcular otra caja
            </button>
        </section>
    </div>

    <script>
        const JSON_URL = 'https://raw.githubusercontent.com/alejandrrolc/pokevalue-data/main/items.json';
        let storeData = [];

        // Cargar JSON al iniciar
        async function fetchStoreData() {
            try {
                const response = await fetch(JSON_URL);
                const data = await response.json();
                storeData = data.objetos;
                document.getElementById('last-updated').innerText = `Precios actualizados el: ${data.last_updated}`;
                renderItems();
            } catch (error) {
                document.getElementById('items-container').innerHTML = `<p class="text-red-500 text-sm">Error al cargar datos.</p>`;
            }
        }

        // Renderizar lista de objetos
        function renderItems() {
            const container = document.getElementById('items-container');
            container.innerHTML = '';

            storeData.forEach(item => {
                const div = document.createElement('div');
                div.className = 'flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-100';
                div.innerHTML = `
                    <div>
                        <p class="font-medium text-sm text-gray-800">${item.name}</p>
                        <p class="text-xs text-gray-400">Unidad: ${item.unit_price_eur.toFixed(2)} €</p>
                    </div>
                    <input type="number" min="0" value="0" data-id="${item.id}" class="item-qty w-16 px-2 py-1 border border-gray-300 rounded-md text-center text-sm font-semibold focus:ring-1 focus:ring-indigo-500">
                `;
                container.appendChild(div);
            });
        }

        // Calcular y cambiar de pantalla
        function calculate() {
            const boxPriceInput = document.getElementById('box-price');
            const boxPrice = parseFloat(boxPriceInput.value);

            if (isNaN(boxPrice) || boxPrice <= 0) {
                alert("Por favor, introduce un precio válido para la caja.");
                return;
            }

            let totalValue = 0;
            const qtyInputs = document.querySelectorAll('.item-qty');
            
            qtyInputs.forEach(input => {
                const qty = parseInt(input.value) || 0;
                const itemId = input.getAttribute('data-id');
                const item = storeData.find(i => i.id === itemId);
                if (item && qty > 0) {
                    totalValue += item.unit_price_eur * qty;
                }
            });

            const diff = totalValue - boxPrice;
            const isProfitable = diff > 0;

            // Configurar tarjeta de resultado
            const resCard = document.getElementById('result-card');
            resCard.className = `p-6 rounded-xl text-center space-y-4 text-white ${isProfitable ? 'bg-emerald-500' : 'bg-rose-500'}`;

            document.getElementById('result-title').innerText = isProfitable ? "¡OFERTA RENTABLE! 🎉" : "NO VALE LA PENA ❌";
            document.getElementById('res-box-price').innerText = boxPrice.toFixed(2) + " €";
            document.getElementById('res-real-value').innerText = totalValue.toFixed(2) + " €";
            document.getElementById('res-diff-label').innerText = isProfitable ? "Ahorras:" : "Pierdes:";
            document.getElementById('res-diff-val').innerText = Math.abs(diff).toFixed(2) + " €";

            // Transición de vistas
            document.getElementById('view-form').classList.add('hidden');
            document.getElementById('view-result').classList.remove('hidden');
        }

        // Volver al formulario limpiando datos
        function resetCalculator() {
            // Limpiar inputs
            document.getElementById('box-price').value = '';
            document.querySelectorAll('.item-qty').forEach(input => input.value = 0);

            // Cambiar vista
            document.getElementById('view-result').classList.add('hidden');
            document.getElementById('view-form').classList.remove('hidden');

            // Hacer scroll suave arriba
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        fetchStoreData();
    </script>
</body>
</html>
