<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Fondo Gradiente Nocturno Índigo Profundo -->
    <linearGradient id="bg-banner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="40%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <!-- Gradiente de Título -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Gradientes 3D Isométricos -->
    <linearGradient id="red-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="red-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="red-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>

    <linearGradient id="white-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="white-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="gold-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FDE047"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="gold-ribbon-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="gold-ribbon-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Filtros de Sombra y Resplandor -->
    <filter id="box-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity="0.8"/>
    </filter>
    <filter id="neon-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#FBBF24" flood-opacity="0.9"/>
    </filter>
    <filter id="core-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Fondo Principal -->
  <rect width="1200" height="630" fill="url(#bg-banner)"/>

  <!-- Orbes Decorativos de Fondo -->
  <circle cx="280" cy="300" r="320" fill="#4338CA" opacity="0.35" filter="blur(80px)"/>
  <circle cx="1050" cy="500" r="350" fill="#6366F1" opacity="0.25" filter="blur(90px)"/>

  <!-- CONTENEDOR IZQUIERDO: LOGOTIPO 3D POKÉ-GIFT BOX -->
  <g transform="translate(40, 20)">
    <!-- Sombra Proyectada en el Suelo -->
    <ellipse cx="256" cy="485" rx="180" ry="50" fill="#020617" opacity="0.6"/>

    <g filter="url(#box-shadow)">
      <!-- 1. BASE INFERIOR (BLANCO PERLADO) -->
      <path d="M 110 290 L 256 368 L 256 468 L 110 390 Z" fill="url(#white-left)"/>
      <path d="M 256 368 L 402 290 L 402 390 L 256 468 Z" fill="url(#white-right)"/>

      <!-- Franja Negra divisoria -->
      <path d="M 110 290 L 256 368 L 256 307 L 110 229 Z" fill="#0F172A"/>
      <path d="M 256 368 L 402 290 L 402 229 L 256 307 Z" fill="#020617"/>

      <!-- Cintas Doradas en la Base -->
      <path d="M 175 324 L 203 340 L 203 439 L 175 425 Z" fill="url(#gold-ribbon-left)"/>
      <path d="M 309 340 L 337 324 L 337 425 L 309 439 Z" fill="url(#gold-ribbon-right)"/>

      <!-- 2. TAPA SUPERIOR (ROJO CARMESÍ BRILLANTE) -->
      <path d="M 95 245 L 256 331 L 256 275 L 95 189 Z" fill="url(#red-left)"/>
      <path d="M 256 331 L 417 245 L 417 189 L 256 275 Z" fill="url(#red-right)"/>
      <path d="M 256 111 L 417 189 L 256 275 L 95 189 Z" fill="url(#red-top)"/>

      <!-- Reflejos Glossy -->
      <path d="M 256 122 L 395 189 L 256 261 L 117 189 Z" fill="#FFFFFF" opacity="0.2"/>
      <path d="M 99 190 L 256 114 L 245 114 L 95 192 Z" fill="#FFFFFF" opacity="0.6"/>

      <!-- Cintas Doradas en la Tapa -->
      <path d="M 236 121 L 276 141 L 276 265 L 236 245 Z" fill="url(#gold-ribbon-right)" opacity="0.95"/>
      <path d="M 135 210 L 377 210 L 350 225 L 162 225 Z" fill="url(#gold-ribbon-left)" opacity="0.85"/>
      <path d="M 167 228 L 196 244 L 196 299 L 167 283 Z" fill="url(#gold-ribbon-left)"/>
      <path d="M 316 244 L 345 228 L 345 283 L 316 299 Z" fill="url(#gold-ribbon-right)"/>

      <!-- 3. BOTÓN POKÉBALL FRONTAL CON NÚCLEO NEÓN -->
      <g transform="translate(256, 331)">
        <circle cx="0" cy="0" r="36" fill="#D97706"/>
        <circle cx="0" cy="0" r="31" fill="url(#gold-glow-grad)"/>
        <circle cx="0" cy="0" r="22" fill="#0F172A"/>
        <circle cx="0" cy="0" r="16" fill="#0284C7"/>
        <circle cx="0" cy="0" r="11" fill="#38BDF8" filter="url(#core-glow)"/>
        <circle cx="0" cy="0" r="5" fill="#E0F2FE"/>
      </g>

      <!-- 4. LAZO DE REGALO DORADO SUPERIOR (3D BOW) -->
      <g filter="url(#neon-glow)" transform="translate(256, 128)">
        <path d="M 0 -9 C -50 -72 -123 -28 -73 17 C -39 28 -11 6 0 -5 Z" fill="url(#gold-glow-grad)"/>
        <path d="M -6 -7 C -45 -54 -95 -20 -58 11 C -31 18 -13 4 -6 -3 Z" fill="#1E1B4B" opacity="0.35"/>
        <path d="M -17 -28 C -50 -62 -95 -28 -62 6 Z" fill="#FFFFFF" opacity="0.45"/>

        <path d="M 0 -9 C 50 -72 123 -28 73 17 C 39 28 11 6 0 -5 Z" fill="url(#gold-glow-grad)"/>
        <path d="M 6 -7 C 45 -54 95 -20 58 11 C 31 18 13 4 6 -3 Z" fill="#1E1B4B" opacity="0.35"/>
        <path d="M 17 -28 C 50 -62 95 -28 62 6 Z" fill="#FFFFFF" opacity="0.45"/>

        <path d="M -9 2 C -34 22 -67 62 -95 84 C -84 84 -56 50 -6 20 Z" fill="url(#gold-glow-grad)"/>
        <path d="M 9 2 C 34 22 67 62 95 84 C 84 84 56 50 6 20 Z" fill="url(#gold-glow-grad)"/>

        <circle cx="0" cy="-2" r="17" fill="url(#gold-glow-grad)"/>
        <ellipse cx="-3" cy="-6" rx="6" ry="3.5" fill="#FFFFFF" opacity="0.8"/>
      </g>
    </g>

    <!-- 5. MONEDAS Y DESTELLOS FLOTANTES -->
    <g filter="url(#neon-glow)">
      <!-- Moneda Superior Derecha -->
      <g transform="translate(435, 140) scale(1.1)">
        <circle cx="0" cy="0" r="22" fill="#F59E0B" stroke="#FDE047" stroke-width="3"/>
        <circle cx="0" cy="0" r="16" fill="#FDE047" opacity="0.4"/>
        <text x="0" y="7" font-family="Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#78350F">P</text>
      </g>

      <!-- Moneda Superior Izquierda -->
      <g transform="translate(75, 155) scale(0.9)">
        <circle cx="0" cy="0" r="22" fill="#F59E0B" stroke="#FDE047" stroke-width="3"/>
        <circle cx="0" cy="0" r="16" fill="#FDE047" opacity="0.4"/>
        <text x="0" y="7" font-family="Arial, sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#78350F">P</text>
      </g>

      <!-- Destellos Estelares -->
      <path d="M 405 325 L 412 345 L 432 352 L 412 359 L 405 379 L 398 359 L 378 352 L 398 345 Z" fill="#FEF08A"/>
      <path d="M 105 348 L 109 361 L 122 365 L 109 369 L 105 382 L 101 369 L 88 365 L 101 361 Z" fill="#FEF08A"/>
      <circle cx="350" cy="105" r="4.5" fill="#FDE047"/>
      <circle cx="150" cy="100" r="4" fill="#FDE047"/>
    </g>
  </g>

  <!-- CONTENEDOR DERECHO: TEXTOS Y PROPUESTA DE VALOR -->
  <g transform="translate(560, 140)">
    <!-- Badge Superior -->
    <rect x="0" y="0" width="290" height="42" rx="21" fill="#312E81" stroke="#6366F1" stroke-width="2"/>
    <text x="145" y="27" fill="#C7D2FE" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
      CALCULADORA DE TIENDA
    </text>

    <!-- Título de Marca -->
    <text x="0" y="118" fill="url(#title-grad)" font-family="system-ui, -apple-system, sans-serif" font-size="58" font-weight="900" letter-spacing="-1.5">
      PokeBoxValue
    </text>

    <!-- Subtítulos -->
    <text x="0" y="180" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700">
      ¿Vale la pena la caja de Pokémon GO?
    </text>
    <text x="0" y="222" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="400">
      Calcula el valor real, % de ahorro, pases de incursión e incubadoras.
    </text>

    <!-- Badges de Métricas Destacadas -->
    <g transform="translate(0, 275)">
      <!-- Badge Grado S -->
      <rect x="0" y="0" width="135" height="48" rx="14" fill="#059669" stroke="#10B981" stroke-width="1.5"/>
      <text x="67" y="30" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
        GRADO S
      </text>

      <!-- Badge Monedas -->
      <rect x="150" y="0" width="190" height="48" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
      <text x="245" y="30" fill="#FDE047" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">
        EUR • USD • POKÉ
      </text>

      <!-- Badge Web App -->
      <rect x="355" y="0" width="195" height="48" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
      <text x="452" y="30" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
        pokeboxvalue.com
      </text>
    </g>
  </g>
</svg>
