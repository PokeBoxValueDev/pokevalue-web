<!-- Formulario -->
<section id="view-form"
    class="bg-white dark:bg-gray-800 rounded-2xl shadow-md p-6 space-y-6 border border-gray-100 dark:border-gray-700 transition-all duration-200">
    <div>
        <label for="box-price" class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">
            <span data-i18n="boxPriceLabel">Precio de la Caja</span> (<span class="currency-label-full">EUR
                €</span>)
        </label>
        <input type="number" step="0.01" id="box-price" placeholder="Ej: 8.99" aria-label="Precio de la Caja" inputmode="decimal" pattern="[0-9]*"
            class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-base">
        <p id="usd-disclaimer" data-i18n="disclaimerUSD"
            class="text-[11px] text-amber-600 dark:text-amber-400 mt-1 hidden"></p>
        <p id="box-price-error" class="hidden text-xs text-rose-500 mt-1 font-medium"
            data-i18n="enterValidPrice"></p>
    </div>

    <div>
        <div class="flex justify-between items-center mb-2">
            <h2 data-i18n="itemsIncluded" class="text-sm font-semibold text-gray-700 dark:text-gray-200">
                Objetos incluidos</h2>
            <button id="btn-reset-qty" type="button" data-i18n="btnResetQty"
                class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold hover:underline cursor-pointer">
                Limpiar
            </button>
        </div>

        <!-- Píldoras de Filtrado Rápido por Categoría -->
        <div id="category-filter-pills" class="flex gap-1.5 overflow-x-auto pb-2 mb-2 scrollbar-none text-xs">
            <button type="button" data-category="all" data-i18n="filterAll" class="category-pill whitespace-nowrap px-3 py-1 rounded-full font-medium transition bg-indigo-600 text-white shadow-sm">Todos</button>
            <button type="button" data-category="pases" data-i18n="filterPasses" class="category-pill whitespace-nowrap px-3 py-1 rounded-full font-medium transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Pases</button>
            <button type="button" data-category="incubadoras" data-i18n="filterIncubators" class="category-pill whitespace-nowrap px-3 py-1 rounded-full font-medium transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Incubadoras</button>
            <button type="button" data-category="potenciadores" data-i18n="filterBoosts" class="category-pill whitespace-nowrap px-3 py-1 rounded-full font-medium transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Potenciadores</button>
            <button type="button" data-category="mejoras" data-i18n="filterUpgrades" class="category-pill whitespace-nowrap px-3 py-1 rounded-full font-medium transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Mejoras</button>
            <button type="button" data-category="consumibles" data-i18n="filterConsumables" class="category-pill whitespace-nowrap px-3 py-1 rounded-full font-medium transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Consumibles</button>
            <button type="button" data-category="otros" data-i18n="filterOther" class="category-pill whitespace-nowrap px-3 py-1 rounded-full font-medium transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Otros</button>
        </div>

        <input type="text" id="search-input" data-i18n-placeholder="searchPlaceholder" aria-label="Buscar objetos"
            placeholder="Buscar objeto..."
            class="w-full px-3 py-1.5 text-sm mb-3 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        
        <div id="items-container" class="space-y-5 max-h-96 overflow-y-auto pr-1">
            <div id="items-loading-skeleton" class="animate-pulse space-y-3 py-2">
                <span class="sr-only" data-i18n="loadingItems">Cargando objetos...</span>
                <div class="flex items-center justify-between p-2.5 bg-gray-100 dark:bg-gray-700/50 rounded-xl">
                    <div class="flex items-center gap-3">
                        <div class="w-14 h-14 bg-gray-200 dark:bg-gray-600 rounded-2xl"></div>
                        <div class="h-4 w-32 bg-gray-200 dark:bg-gray-600 rounded"></div>
                    </div>
                    <div class="h-8 w-24 bg-gray-200 dark:bg-gray-600 rounded-lg"></div>
                </div>
            </div>
        </div>
    </div>

    <button id="btn-calculate" data-i18n="btnCalculate"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-sm">
        Calcular Rentabilidad
    </button>

    <!-- Historial -->
    <!--#include "history.html"-->
</section>

<!-- Barra Flotante de Cálculo en Vivo (Sticky Summary Bar) -->
<aside id="live-sticky-bar" class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-md z-40 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md border border-gray-200 dark:border-gray-700 rounded-2xl shadow-xl p-3 flex items-center justify-between transition-all duration-300 transform translate-y-28 opacity-0 pointer-events-none">
    <div class="flex items-center gap-2.5">
        <span id="live-grade-badge" class="px-2 py-0.5 rounded-lg text-xs font-black bg-emerald-500 text-white shadow-sm">S</span>
        <div class="text-xs">
            <span class="text-gray-500 dark:text-gray-400 font-medium" data-i18n="liveBarTotal">Valor:</span>
            <span id="live-total-val" class="font-bold text-gray-900 dark:text-white ml-0.5">0.00€</span>
            <span id="live-diff-tag" class="ml-1 font-bold text-emerald-600 dark:text-emerald-400">(+0.00€)</span>
        </div>
    </div>
    <button id="btn-live-view-result" type="button" data-i18n="liveBarBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition shadow-sm cursor-pointer">
        Ver Tarjeta
    </button>
</aside>
