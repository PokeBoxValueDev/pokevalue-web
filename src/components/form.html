<!-- Formulario -->
<section id="view-form"
    class="bg-white dark:bg-gray-800 rounded-2xl shadow-md p-5 sm:p-6 space-y-4 border border-gray-100 dark:border-gray-700 transition-all duration-200">
    
    <!-- Barra Superior Unificada: Precio de la Caja + Buscador Dinámico + Selector de Vista -->
    <div id="top-controls-bar" class="space-y-1.5">
        <div class="flex items-end gap-2 relative">
            <!-- Bloque Precio (se contrae suavemente al hacer foco en el buscador) -->
            <div id="box-price-container" class="w-[48%] sm:w-[45%] min-w-[130px] transition-all duration-300 ease-in-out flex-shrink-0">
                <label for="box-price" class="block text-[11px] sm:text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1 truncate">
                    <span data-i18n="boxPriceLabel">Precio Caja</span> (<span class="currency-label-full">EUR €</span>)
                </label>
                <input type="number" step="0.01" id="box-price" placeholder="Ej: 8.99" aria-label="Precio de la Caja" inputmode="decimal" pattern="[0-9]*"
                    class="w-full px-2.5 py-1.5 sm:px-3 sm:py-2 border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm sm:text-base font-bold shadow-2xs">
            </div>

            <!-- Bloque Buscador (se expande al hacer foco) + Selector de Vista -->
            <div id="search-layout-container" class="flex-1 flex items-end gap-1.5 transition-all duration-300 ease-in-out min-w-0">
                <div class="relative flex-1 min-w-0">
                    <input type="text" id="search-input" data-i18n-placeholder="searchPlaceholder" aria-label="Buscar objetos"
                        placeholder="Buscar..."
                        class="w-full pl-7 sm:pl-8 pr-2.5 py-1.5 sm:py-2 text-xs sm:text-sm border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all shadow-2xs">
                    <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-gray-400 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                </div>
                <!-- Selector de Densidad de Vista (Lista / Cuadrícula 2A) -->
                <div id="layout-toggle-group" role="group" aria-label="Modo de visualización" class="flex items-center bg-gray-100 dark:bg-gray-700 p-0.5 rounded-xl border border-gray-200 dark:border-gray-600 flex-shrink-0 mb-0.5">
                    <button id="btn-layout-list" type="button" aria-label="Vista Lista" data-layout="list" class="layout-toggle-btn p-1.5 rounded-lg text-indigo-600 dark:text-white bg-white dark:bg-gray-800 shadow-xs transition" title="Vista Lista">
                        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    </button>
                    <button id="btn-layout-grid" type="button" aria-label="Vista Cuadrícula" data-layout="grid" class="layout-toggle-btn p-1.5 rounded-lg text-gray-400 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition" title="Vista Cuadrícula">
                        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                    </button>
                </div>
            </div>
        </div>
        <p id="usd-disclaimer" data-i18n="disclaimerUSD"
            class="text-[11px] text-amber-600 dark:text-amber-400 mt-1 hidden"></p>
        <p id="box-price-error" role="alert" aria-live="assertive" class="hidden text-xs text-rose-500 mt-1 font-medium"
            data-i18n="enterValidPrice"></p>
    </div>

    <div>
        <div class="flex justify-between items-center mb-2">
            <h2 data-i18n="itemsIncluded" class="text-sm font-semibold text-gray-700 dark:text-gray-200">
                Objetos incluidos</h2>
            <button id="btn-reset-qty" type="button" data-i18n="btnResetQty" aria-label="Limpiar cantidades seleccionadas"
                class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold hover:underline cursor-pointer touch-manipulation py-1 px-2 -mr-1 rounded-lg hover:bg-indigo-50 dark:hover:bg-gray-700 transition">
                Limpiar
            </button>
        </div>

        <!-- Píldoras de Filtrado Rápido por Categoría -->
        <div id="category-filter-pills" role="toolbar" aria-label="Filtro de categorías de objetos" class="flex gap-1.5 overflow-x-auto pb-1.5 mb-2 no-scrollbar scrollbar-none text-xs">
            <button type="button" data-category="all" data-i18n="filterAll" aria-label="Mostrar todas las categorías" class="category-pill whitespace-nowrap px-3 py-1 rounded-full font-medium transition bg-indigo-600 text-white shadow-sm">Todos</button>
            <button type="button" data-category="pases" data-i18n="filterPasses" aria-label="Filtrar por Pases de Incursión" class="category-pill whitespace-nowrap px-3 py-1 rounded-full font-medium transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Pases</button>
            <button type="button" data-category="incubadoras" data-i18n="filterIncubators" aria-label="Filtrar por Incubadoras" class="category-pill whitespace-nowrap px-3 py-1 rounded-full font-medium transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Incubadoras</button>
            <button type="button" data-category="potenciadores" data-i18n="filterBoosts" aria-label="Filtrar por Potenciadores" class="category-pill whitespace-nowrap px-3 py-1 rounded-full font-medium transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Potenciadores</button>
            <button type="button" data-category="mejoras" data-i18n="filterUpgrades" aria-label="Filtrar por Mejoras" class="category-pill whitespace-nowrap px-3 py-1 rounded-full font-medium transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Mejoras</button>
            <button type="button" data-category="combates" data-i18n="filterBattles" aria-label="Filtrar por Combates y Partículas" class="category-pill whitespace-nowrap px-3 py-1 rounded-full font-medium transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Combates</button>
            <button type="button" data-category="consumibles" data-i18n="filterConsumables" aria-label="Filtrar por Consumibles" class="category-pill whitespace-nowrap px-3 py-1 rounded-full font-medium transition bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 hover:bg-gray-200 dark:hover:bg-gray-600">Consumibles</button>
        </div>

        <!-- Bandeja de Objetos en tu Caja (1C) -->
        <div id="selected-items-tray" class="hidden mb-2 p-2 bg-indigo-50/60 dark:bg-indigo-950/40 border border-indigo-100 dark:border-indigo-900/50 rounded-lg transition-all duration-200">
            <div class="flex items-center justify-between mb-1 px-0.5">
                <span class="text-[10px] font-bold text-indigo-900 dark:text-indigo-200 uppercase tracking-wider flex items-center gap-1" data-i18n="selectedTrayTitle">
                    Objetos en tu Caja
                </span>
                <button id="btn-clear-tray" type="button" data-i18n="clearBox" aria-label="Vaciar caja"
                    class="text-[10px] text-indigo-600 dark:text-indigo-400 font-semibold hover:underline cursor-pointer touch-manipulation">
                    Vaciar
                </button>
            </div>
            <div id="selected-chips-list" class="flex flex-wrap gap-1">
                <!-- Chips dinámicos inyectados aquí -->
            </div>
        </div>
        
        <div id="items-container" class="space-y-5 max-h-96 overflow-y-auto pr-1">
            <div id="items-loading-skeleton" class="animate-pulse space-y-3 py-2">
                <span class="sr-only" data-i18n="loadingItems">Cargando objetos...</span>
                <div class="flex items-center justify-between p-2.5 bg-gray-100 dark:bg-gray-700/50 rounded-xl">
                    <div class="flex items-center gap-3">
                        <div class="w-14 h-14 bg-gray-200 dark:bg-gray-600 rounded-2xl"></div>
                        <div class="h-4 w-32 bg-gray-200 dark:bg-gray-600 rounded"></div>
                    </div>
                    <div class="h-8 w-24 bg-gray-200 dark:bg-gray-600 rounded-lg"></div>
                </div>
            </div>
        </div>
    </div>

    <button id="btn-calculate" data-i18n="btnCalculate" aria-label="Calcular Rentabilidad de la Caja"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-sm cursor-pointer touch-manipulation">
        Calcular Rentabilidad
    </button>

    <!-- Historial -->
    <!--#include "history.html"-->
</section>

<!-- Barra Flotante de Cálculo en Vivo (Sticky Summary Bar) -->
<div id="live-sticky-bar" role="status" aria-live="polite" aria-label="Resumen de cálculo en vivo" class="fixed bottom-4 left-1/2 -translate-x-1/2 w-[92%] max-w-md z-40 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md border border-gray-200 dark:border-gray-700 rounded-2xl shadow-xl p-3 flex items-center justify-between transition-all duration-300 transform translate-y-28 opacity-0 pointer-events-none">
    <div class="flex items-center gap-2.5">
        <span id="live-grade-badge" class="px-2 py-0.5 rounded-lg text-xs font-black bg-emerald-500 text-white shadow-sm">S</span>
        <div class="text-xs">
            <span class="text-gray-500 dark:text-gray-400 font-medium" data-i18n="liveBarTotal">Valor:</span>
            <span id="live-total-val" class="font-bold text-gray-900 dark:text-white ml-0.5">0.00€</span>
            <span id="live-diff-tag" class="ml-1 font-bold text-emerald-600 dark:text-emerald-400">(+0.00€)</span>
        </div>
    </div>
    <button id="btn-live-view-result" type="button" data-i18n="liveBarBtn" aria-label="Ver tarjeta completa de resultados" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition shadow-sm cursor-pointer">
        Ver Tarjeta
    </button>
</div>
