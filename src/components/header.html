<!-- Header -->
<header class="flex justify-between items-center mb-4 sm:mb-6">
    <div id="site-logo" class="flex items-center gap-3 cursor-pointer select-none">
        <img id="site-logo-light" src="/favicon-light.svg" alt="PokeBoxValue Logo" class="w-9 h-9 dark:hidden">
        <img id="site-logo-dark" src="/favicon.svg" alt="PokeBoxValue Logo" class="w-9 h-9 hidden dark:block">
        <div class="text-left">
            <h1 class="text-2xl font-bold text-indigo-600 dark:text-indigo-400 leading-tight">
                PokeBoxValue
            </h1>
            <p id="last-updated" class="text-[10px] text-gray-400 dark:text-gray-500 font-normal opacity-75">
                <span data-i18n="lastUpdated">Data:</span> --/--/----
            </p>
        </div>
    </div>

    <div class="flex items-center gap-1 sm:gap-2">
        <!-- Botón Instalar PWA (Se muestra cuando el navegador lo soporta) -->
        <button id="btn-install-pwa" type="button" aria-label="Instalar App"
            class="hidden px-2.5 py-1 text-xs font-semibold text-indigo-700 bg-indigo-50 dark:bg-indigo-900/40 dark:text-indigo-300 rounded-md border border-indigo-200 dark:border-indigo-700 hover:bg-indigo-100 dark:hover:bg-indigo-900/70 transition flex items-center gap-1 cursor-pointer">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            <span class="hidden sm:inline" data-i18n="btnInstallApp">Instalar</span>
        </button>

        <!-- Selector de Idioma -->
        <div class="relative">
            <select id="lang-select" aria-label="Seleccionar idioma"
                class="appearance-none bg-white dark:bg-gray-800 text-gray-900 dark:text-white py-1 pl-2.5 pr-6 text-xs sm:text-sm font-semibold rounded-md border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer shadow-sm">
                <option value="es" class="bg-white dark:bg-gray-800 text-gray-900 dark:text-white font-medium">ES</option>
                <option value="en" class="bg-white dark:bg-gray-800 text-gray-900 dark:text-white font-medium">EN</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-1 flex items-center px-1 text-gray-500">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                    </path>
                </svg>
            </div>
        </div>

        <!-- Selector de Moneda -->
        <div class="relative">
            <select id="currency-select" aria-label="Seleccionar divisa"
                class="appearance-none bg-white dark:bg-gray-800 text-gray-900 dark:text-white py-1 pl-2.5 pr-6 text-xs sm:text-sm font-semibold rounded-md border border-gray-300 dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer shadow-sm">
                <option value="EUR" class="bg-white dark:bg-gray-800 text-gray-900 dark:text-white font-medium">€</option>
                <option value="USD" class="bg-white dark:bg-gray-800 text-gray-900 dark:text-white font-medium">$</option>
                <option value="POKECOINS" class="bg-white dark:bg-gray-800 text-gray-900 dark:text-white font-medium">🟡</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-1 flex items-center px-1 text-gray-500">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                    </path>
                </svg>
            </div>
        </div>

        <!-- Botón Modo Oscuro -->
        <button id="theme-toggle-btn" type="button" aria-label="Cambiar tema"
            class="p-1.5 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <svg id="theme-toggle-dark-icon" class="hidden w-4 h-4" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
            </svg>
            <svg id="theme-toggle-light-icon" class="hidden w-4 h-4" fill="none" stroke="currentColor"
                viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                </path>
            </svg>
        </button>
    </div>
</header>

<!-- Banner de Instalación Inteligente para iOS (iPhone / iPad en Safari) -->
<aside id="ios-install-banner" aria-label="Instalar aplicación en iPhone"
    class="hidden mb-4 p-3.5 bg-gradient-to-r from-indigo-950 via-purple-950 to-slate-950 text-white rounded-xl border border-indigo-500/40 shadow-xl relative backdrop-blur-md transition-all duration-300">
    <div class="flex items-start gap-3">
        <img src="/favicon.svg" alt="PokeBoxValue Logo" class="w-10 h-10 rounded-xl flex-shrink-0 shadow-md border border-white/20 bg-indigo-900/60 p-1 mt-0.5">
        <div class="flex-1 text-xs pr-6">
            <h2 class="text-xs sm:text-sm font-bold text-white flex items-center gap-1.5" data-i18n="iosInstallTitle">
                Instalar PokeBoxValue
            </h2>
            <p class="text-indigo-200/90 mt-1 leading-relaxed text-[11px]">
                <span data-i18n="iosInstallDesc">Úsala a pantalla completa y sin conexión en tu iPhone:</span>
                <span class="inline-flex items-center gap-1 px-1.5 py-0.5 mt-1 bg-white/15 rounded text-white font-bold text-[10px]">
                    <span data-i18n="iosInstallStep1">Compartir</span>
                    <svg class="w-3.5 h-3.5 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1M12 3v12m0-12l-4 4m4-4l4 4"/></svg>
                </span>
                <span class="text-indigo-300 text-[10px] mx-0.5">➔</span>
                <span class="inline-flex items-center gap-1 px-1.5 py-0.5 mt-1 bg-white/15 rounded text-white font-bold text-[10px]">
                    <span data-i18n="iosInstallStep2">Añadir a inicio</span>
                    <svg class="w-3.5 h-3.5 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                </span>
            </p>
        </div>
        <button id="btn-close-ios-banner" type="button" aria-label="Cerrar sugerencia de instalación"
            class="absolute top-2.5 right-2.5 text-gray-300 hover:text-white p-1 rounded-md transition cursor-pointer touch-manipulation">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>
</aside>
