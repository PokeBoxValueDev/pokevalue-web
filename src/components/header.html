<!-- Header -->
<header class="flex justify-between items-center mb-6">
    <div id="site-logo" class="flex items-center gap-3 cursor-pointer select-none">
        <img src="favicon.svg" alt="PokeBoxValue Logo" class="w-9 h-9">
        <div class="text-left">
            <h1 class="text-2xl font-bold text-indigo-600 dark:text-indigo-400 leading-tight flex items-center gap-1">
                PokeBoxValue
                <span id="ios-badge" class="hidden inline-flex items-center gap-1 px-1.5 py-0.5 text-[9px] font-extrabold text-indigo-700 bg-indigo-100 dark:bg-indigo-900/60 dark:text-indigo-300 rounded-full border border-indigo-200 dark:border-indigo-700 select-none">iOS</span>
            </h1>
            <p id="last-updated" class="text-[10px] text-gray-400 dark:text-gray-500 font-normal opacity-75">
                <span data-i18n="lastUpdated">Data:</span> --/--/----
            </p>
        </div>
    </div>

    <div class="flex items-center gap-1 sm:gap-2">
        <!-- Selector de Idioma -->
        <div class="relative">
            <select id="lang-select" aria-label="Seleccionar idioma"
                class="appearance-none bg-transparent py-1 pl-2 pr-6 text-xs sm:text-sm font-medium rounded-md border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
                <option value="es">ES</option>
                <option value="en">EN</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-1 flex items-center px-1 text-gray-500">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                    </path>
                </svg>
            </div>
        </div>

        <!-- Selector de Moneda -->
        <div class="relative">
            <select id="currency-select" aria-label="Seleccionar divisa"
                class="appearance-none bg-transparent py-1 pl-2 pr-6 text-xs sm:text-sm font-medium rounded-md border border-gray-300 dark:border-gray-700 hover:bg-gray-100 dark:hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 cursor-pointer">
                <option value="EUR">€</option>
                <option value="USD">$</option>
                <option value="POKECOINS">🟡</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-1 flex items-center px-1 text-gray-500">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7">
                    </path>
                </svg>
            </div>
        </div>

        <!-- Botón Modo Oscuro -->
        <button id="theme-toggle-btn" type="button" aria-label="Cambiar tema"
            class="p-1.5 text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <svg id="theme-toggle-light-icon" aria-hidden="true" class="hidden w-4 h-4 sm:w-5 sm:h-5"
                fill="currentColor" viewBox="0 0 20 20">
                <path
                    d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 100 2h1z"
                    fill-rule="evenodd" clip-rule="evenodd"></path>
            </svg>
            <svg id="theme-toggle-dark-icon" aria-hidden="true" class="hidden w-4 h-4 sm:w-5 sm:h-5"
                fill="currentColor" viewBox="0 0 20 20">
                <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
            </svg>
        </button>
    </div>
</header>
