<!-- Modal Aviso Legal -->
<div id="legal-modal"
    class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div
        class="bg-white dark:bg-gray-800 rounded-2xl max-w-md w-full p-6 shadow-xl text-left border border-gray-200 dark:border-gray-700 max-h-[80vh] overflow-y-auto">
        <h3 data-i18n="legalTitle" class="text-lg font-bold mb-3 text-gray-900 dark:text-white">Aviso Legal</h3>
        <div class="text-xs text-gray-600 dark:text-gray-300 space-y-2">
            <p data-i18n="legalBody1"></p>
            <p data-i18n="legalBody2"></p>
        </div>
        <button data-i18n="btnCloseModal"
            class="btn-close-modal mt-5 w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl text-xs transition">Cerrar</button>
    </div>
</div>
