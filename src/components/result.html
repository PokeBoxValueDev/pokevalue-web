<!-- Resultado: Pantalla de Evaluación Pokémon GO -->
<section id="view-result" role="region" aria-live="polite" aria-label="Resultados del análisis de rentabilidad" class="hidden">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-6 items-start">
        <!-- Columna Izquierda: Tarjeta de Veredicto + Botón Principal Reset -->
        <div class="space-y-4">
            <div id="result-card" class="p-5 sm:p-7 rounded-3xl text-center space-y-4 text-white relative shadow-xl shadow-indigo-950/10 dark:shadow-black/60 overflow-hidden border border-white/20">
                <div class="flex justify-center">
                    <div id="res-grade-badge" class="inline-flex items-center justify-center px-4 py-1.5 text-xs font-black rounded-full bg-black/40 text-white shadow-md border border-white/40 tracking-wider"></div>
                </div>
                <h2 id="result-title" tabindex="-1" data-i18n="resultVerdictTitle" class="text-xl sm:text-2xl font-black tracking-tight focus:outline-none drop-shadow-xs">Resultado</h2>
                <div class="grid grid-cols-2 gap-3 text-sm bg-black/30 p-3.5 rounded-2xl backdrop-blur-md border border-white/10 shadow-inner">
                    <div>
                        <span data-i18n="resBoxPrice" class="block text-xs font-bold text-white/80 uppercase tracking-wider">Precio caja:</span>
                        <strong id="res-box-price" class="text-base sm:text-lg font-black text-white"></strong>
                    </div>
                    <div>
                        <span data-i18n="resRealValue" class="block text-xs font-bold text-white/80 uppercase tracking-wider">Valor real:</span>
                        <strong id="res-real-value" class="text-base sm:text-lg font-black text-white"></strong>
                    </div>
                </div>
                <div class="pt-3 border-t border-white/20">
                    <span id="res-diff-label"
                        class="block text-xs uppercase tracking-widest font-black text-white/90"></span>
                    <span id="res-diff-val" class="text-3xl sm:text-4xl font-black text-white tracking-tight drop-shadow-sm"></span>
                </div>
            </div>

            <!-- Botón Principal de Acción: Calcular otra -->
            <div class="flex justify-center">
                <button id="btn-reset" data-i18n="btnReset"
                    class="w-full max-w-md py-3.5 px-6 bg-gradient-to-r from-indigo-600 via-indigo-500 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-extrabold rounded-2xl text-sm sm:text-base transition shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 active:scale-[0.98] cursor-pointer touch-manipulation flex items-center justify-center gap-2 tracking-wide">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                    <span data-i18n="btnReset">Calcular otra</span>
                </button>
            </div>
        </div>

        <!-- Columna Derecha: Métricas Clave + Desglose + Guardar Caja + Compartir -->
        <div class="space-y-4">
            <!-- Métricas Clave (KVI) -->
            <div id="key-metrics-section"
                class="hidden bg-white dark:bg-gray-800/95 p-4 sm:p-5 rounded-2xl border border-gray-200/80 dark:border-gray-700/80 shadow-sm space-y-2.5">
                <h3 data-i18n="keyMetricsTitle"
                    class="text-xs font-extrabold text-gray-500 dark:text-gray-400 uppercase tracking-wider flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
                    Métricas Clave (Coste Efectivo)
                </h3>
                <div id="key-metrics-container" class="space-y-1.5 text-xs text-gray-700 dark:text-gray-300"></div>
            </div>

            <!-- Desglose Gráfico -->
            <div
                class="bg-white dark:bg-gray-800/95 p-4 sm:p-5 rounded-2xl border border-gray-200/80 dark:border-gray-700/80 shadow-sm space-y-3">
                <h3 data-i18n="breakdownTitle"
                    class="text-xs font-extrabold text-gray-500 dark:text-gray-400 uppercase tracking-wider flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-purple-500"></span>
                    Desglose del Valor
                </h3>
                <div id="breakdown-bar"
                    class="w-full h-3.5 bg-gray-200/80 dark:bg-gray-700/80 rounded-full overflow-hidden flex shadow-inner"></div>
                <div id="breakdown-legend" class="grid grid-cols-2 gap-2 text-xs"></div>
            </div>

            <!-- Guardar Caja Personalizada -->
            <div class="bg-white dark:bg-gray-800/95 p-4 rounded-2xl border border-gray-200/80 dark:border-gray-700/80 shadow-sm space-y-2.5">
                <div class="flex flex-col sm:flex-row gap-2 items-center">
                    <div class="w-full sm:flex-1">
                        <label for="custom-box-name-input" class="sr-only" data-i18n="boxNameLabel">Nombre de la caja</label>
                        <input type="text" id="custom-box-name-input" data-i18n-placeholder="boxNamePlaceholder" placeholder="Ej: Caja de Incursión, Pack Evento..."
                            class="w-full h-10 px-3 text-xs sm:text-sm border border-gray-300 dark:border-gray-600 bg-gray-50/80 dark:bg-gray-700 text-gray-900 dark:text-white rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none font-semibold shadow-2xs">
                    </div>
                    <button id="btn-save-custom-box" type="button" data-i18n="btnSaveBox"
                        class="w-full sm:w-auto h-10 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs transition shadow-sm flex items-center justify-center gap-1.5 cursor-pointer active:scale-95 touch-manipulation flex-shrink-0">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
                        <span id="btn-save-box-label" data-i18n="btnSaveBox">Guardar Caja</span>
                    </button>
                </div>
                <div id="save-box-feedback" class="hidden p-2.5 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 rounded-xl text-emerald-800 dark:text-emerald-300 text-xs font-semibold flex items-center gap-2 transition-all duration-200">
                    <svg class="w-4 h-4 text-emerald-600 dark:text-emerald-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                    <span id="save-box-feedback-text">¡Nombre guardado en el historial!</span>
                </div>
            </div>

            <!-- Sección Dedicada de Compartir Resultado -->
            <div class="bg-white dark:bg-gray-800/95 p-4 rounded-2xl border border-gray-200/80 dark:border-gray-700/80 shadow-sm space-y-3">
                <h3 data-i18n="shareSectionTitle" class="text-xs font-extrabold text-gray-500 dark:text-gray-400 uppercase tracking-wider flex items-center gap-1.5 px-0.5">
                    <svg class="w-3.5 h-3.5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
                    Compartir Resultado
                </h3>
                <div class="grid grid-cols-3 gap-2">
                    <button id="btn-share-story" data-i18n="btnShareStory" aria-label="Compartir en Story 9:16"
                        class="py-3 px-2 bg-gradient-to-r from-purple-600 via-pink-600 to-rose-500 hover:from-purple-500 hover:to-pink-500 text-white font-bold rounded-xl text-xs transition shadow-sm active:scale-95 cursor-pointer touch-manipulation flex flex-col items-center justify-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                        <span>Story (9:16)</span>
                    </button>
                    <button id="btn-share-sticker" data-i18n="btnShareSticker" aria-label="Exportar Sticker para Discord"
                        class="py-3 px-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold rounded-xl text-xs transition shadow-sm active:scale-95 cursor-pointer touch-manipulation flex flex-col items-center justify-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
                        <span>Sticker Discord</span>
                    </button>
                    <button id="btn-share" data-i18n="btnShareText" aria-label="Copiar resumen en texto"
                        class="py-3 px-2 bg-gradient-to-r from-slate-700 to-gray-800 hover:from-slate-600 hover:to-gray-700 text-white font-bold rounded-xl text-xs transition shadow-sm active:scale-95 cursor-pointer touch-manipulation flex flex-col items-center justify-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        <span>Texto</span>
                    </button>
                    <button id="btn-share-card" data-i18n="btnShareCard" class="hidden">
                        Tarjeta (16:9)
                    </button>
                </div>
            </div>
        </div>
    </div>
</section>
