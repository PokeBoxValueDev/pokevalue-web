<!-- Resultado -->
<section id="view-result" role="region" aria-live="polite" aria-label="Resultados del análisis de rentabilidad" class="hidden space-y-4">
    <div id="result-card" class="p-6 rounded-xl text-center space-y-4 text-white relative">
        <div class="flex justify-center">
            <div id="res-grade-badge" class="inline-block px-3 py-1 text-xs font-black rounded-full bg-black/40 text-white shadow-sm border border-white/40"></div>
        </div>
        <h2 id="result-title" tabindex="-1" data-i18n="resultVerdictTitle" class="text-xl font-bold focus:outline-none">Resultado</h2>
        <div class="grid grid-cols-2 gap-2 text-sm bg-black/30 p-3 rounded-lg backdrop-blur-sm">
            <div>
                <span data-i18n="resBoxPrice" class="block text-xs font-medium text-white">Precio caja:</span>
                <strong id="res-box-price" class="text-base text-white"></strong>
            </div>
            <div>
                <span data-i18n="resRealValue" class="block text-xs font-medium text-white">Valor real:</span>
                <strong id="res-real-value" class="text-base text-white"></strong>
            </div>
        </div>
        <div class="pt-2 border-t border-white/30">
            <span id="res-diff-label"
                class="block text-xs uppercase tracking-wider font-bold text-white"></span>
            <span id="res-diff-val" class="text-3xl font-black text-white"></span>
        </div>
    </div>

    <!-- Métricas Clave (KVI) -->
    <div id="key-metrics-section"
        class="hidden bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm space-y-2">
        <h3 data-i18n="keyMetricsTitle"
            class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Métricas Clave (Coste Efectivo)</h3>
        <div id="key-metrics-container" class="space-y-1.5 text-xs text-gray-700 dark:text-gray-300"></div>
    </div>

    <!-- Desglose Gráfico -->
    <div
        class="bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm space-y-3">
        <h3 data-i18n="breakdownTitle"
            class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Desglose del
            Valor</h3>
        <div id="breakdown-bar"
            class="w-full h-3 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden flex"></div>
        <div id="breakdown-legend" class="grid grid-cols-2 gap-2 text-xs"></div>
    </div>

    <!-- Guardar Caja Personalizada (3C) -->
    <div class="bg-white dark:bg-gray-800 p-3.5 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm space-y-2">
        <div class="flex flex-col sm:flex-row gap-2 items-center">
            <div class="w-full sm:flex-1">
                <label for="custom-box-name-input" class="sr-only" data-i18n="boxNameLabel">Nombre de la caja</label>
                <input type="text" id="custom-box-name-input" data-i18n-placeholder="boxNamePlaceholder" placeholder="Ej: Caja de Incursión, Pack Evento..."
                    class="w-full px-3 py-2 text-xs border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <button id="btn-save-custom-box" type="button" data-i18n="btnSaveBox"
                class="w-full sm:w-auto px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs transition shadow-xs flex items-center justify-center gap-1.5 cursor-pointer touch-manipulation flex-shrink-0">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
                <span id="btn-save-box-label" data-i18n="btnSaveBox">Guardar Caja</span>
            </button>
        </div>
        <div id="save-box-feedback" class="hidden p-2 bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/60 rounded-lg text-emerald-800 dark:text-emerald-300 text-xs flex items-center gap-2 transition-all duration-200">
            <svg class="w-4 h-4 text-emerald-600 dark:text-emerald-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
            <span id="save-box-feedback-text">¡Nombre guardado en el historial!</span>
        </div>
    </div>

    <!-- Botón Principal de Acción: Calcular otra -->
    <div>
        <button id="btn-reset" data-i18n="btnReset"
            class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-sm transition shadow-md shadow-indigo-500/25 active:scale-[0.99] cursor-pointer touch-manipulation flex items-center justify-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            <span data-i18n="btnReset">Calcular otra</span>
        </button>
    </div>

    <!-- Sección Dedicada de Compartir Resultado -->
    <div class="bg-white dark:bg-gray-800 p-3.5 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm space-y-2.5">
        <h3 data-i18n="shareSectionTitle" class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider flex items-center gap-1.5 px-0.5">
            <svg class="w-3.5 h-3.5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/></svg>
            Compartir Resultado
        </h3>
        <div class="grid grid-cols-3 gap-2">
            <button id="btn-share-story" data-i18n="btnShareStory" aria-label="Compartir en Story 9:16"
                class="py-2.5 px-2 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold rounded-lg text-xs transition shadow-xs active:scale-[0.98] cursor-pointer touch-manipulation flex flex-col items-center justify-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                <span>Story (9:16)</span>
            </button>
            <button id="btn-share-sticker" data-i18n="btnShareSticker" aria-label="Exportar Sticker para Discord"
                class="py-2.5 px-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold rounded-lg text-xs transition shadow-xs active:scale-[0.98] cursor-pointer touch-manipulation flex flex-col items-center justify-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"/></svg>
                <span>Sticker Discord</span>
            </button>
            <button id="btn-share" data-i18n="btnShareText" aria-label="Copiar resumen en texto"
                class="py-2.5 px-2 bg-gray-700 hover:bg-gray-600 dark:bg-gray-700 dark:hover:bg-gray-600 text-white font-semibold rounded-lg text-xs transition shadow-xs active:scale-[0.98] cursor-pointer touch-manipulation flex flex-col items-center justify-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                <span>Texto</span>
            </button>
            <button id="btn-share-card" data-i18n="btnShareCard" class="hidden">
                Tarjeta (16:9)
            </button>
        </div>
    </div>
</section>
