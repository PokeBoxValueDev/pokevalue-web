<!-- Resultado -->
<section id="view-result" role="region" aria-live="polite" aria-label="Resultados del análisis de rentabilidad" class="hidden space-y-4">
    <div id="result-card" class="p-6 rounded-xl text-center space-y-4 text-white relative">
        <div class="flex justify-center">
            <div id="res-grade-badge" class="inline-block px-3 py-1 text-xs font-black rounded-full bg-black/40 text-white shadow-sm border border-white/40"></div>
        </div>
        <h2 id="result-title" tabindex="-1" data-i18n="resultVerdictTitle" class="text-xl font-bold focus:outline-none">Resultado</h2>
        <div class="grid grid-cols-2 gap-2 text-sm bg-black/30 p-3 rounded-lg backdrop-blur-sm">
            <div>
                <span data-i18n="resBoxPrice" class="block text-xs font-medium text-white">Precio caja:</span>
                <strong id="res-box-price" class="text-base text-white"></strong>
            </div>
            <div>
                <span data-i18n="resRealValue" class="block text-xs font-medium text-white">Valor real:</span>
                <strong id="res-real-value" class="text-base text-white"></strong>
            </div>
        </div>
        <div class="pt-2 border-t border-white/30">
            <span id="res-diff-label"
                class="block text-xs uppercase tracking-wider font-bold text-white"></span>
            <span id="res-diff-val" class="text-3xl font-black text-white"></span>
        </div>
    </div>

    <!-- Métricas Clave (KVI) -->
    <div id="key-metrics-section"
        class="hidden bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm space-y-2">
        <h3 data-i18n="keyMetricsTitle"
            class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Métricas Clave (Coste Efectivo)</h3>
        <div id="key-metrics-container" class="space-y-1.5 text-xs text-gray-700 dark:text-gray-300"></div>
    </div>

    <!-- Desglose Gráfico -->
    <div
        class="bg-white dark:bg-gray-800 p-4 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm space-y-3">
        <h3 data-i18n="breakdownTitle"
            class="text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Desglose del
            Valor</h3>
        <div id="breakdown-bar"
            class="w-full h-3 bg-gray-200 dark:bg-gray-700 rounded-full overflow-hidden flex"></div>
        <div id="breakdown-legend" class="grid grid-cols-2 gap-2 text-xs"></div>
    </div>

    <!-- Guardar Caja Personalizada (3C) -->
    <div class="bg-white dark:bg-gray-800 p-3.5 rounded-xl border border-gray-100 dark:border-gray-700 shadow-sm flex flex-col sm:flex-row gap-2 items-center">
        <div class="w-full sm:flex-1">
            <label for="custom-box-name-input" class="sr-only" data-i18n="boxNameLabel">Nombre de la caja</label>
            <input type="text" id="custom-box-name-input" data-i18n-placeholder="boxNamePlaceholder" placeholder="Ej: Caja de Incursión, Pack Evento..."
                class="w-full px-3 py-2 text-xs border border-gray-300 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        </div>
        <button id="btn-save-custom-box" type="button" data-i18n="btnSaveBox"
            class="w-full sm:w-auto px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs transition shadow-xs flex items-center justify-center gap-1.5 cursor-pointer touch-manipulation flex-shrink-0">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"/></svg>
            <span id="btn-save-box-label" data-i18n="btnSaveBox">Guardar Caja</span>
        </button>
    </div>

    <!-- Botones de Acción Mobile-First (2x2 en móvil, 4 en línea en tablet/desktop) -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 pt-1">
        <button id="btn-reset" data-i18n="btnReset"
            class="py-3 px-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs sm:text-sm transition shadow-md shadow-indigo-500/25 active:scale-[0.98] cursor-pointer touch-manipulation">
            Calcular otra
        </button>
        <button id="btn-share-story" data-i18n="btnShareStory"
            class="py-3 px-2 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-bold rounded-xl text-xs sm:text-sm transition shadow-md shadow-pink-500/20 active:scale-[0.98] cursor-pointer touch-manipulation">
            Story (9:16)
        </button>
        <button id="btn-share-sticker" data-i18n="btnShareSticker"
            class="py-3 px-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs sm:text-sm transition shadow-md shadow-emerald-500/20 active:scale-[0.98] cursor-pointer touch-manipulation">
            Sticker (Discord)
        </button>
        <button id="btn-share" data-i18n="btnShareText"
            class="py-3 px-2 bg-slate-700 hover:bg-slate-600 dark:bg-gray-700 dark:hover:bg-gray-600 text-white font-medium rounded-xl text-xs sm:text-sm transition shadow-sm active:scale-[0.98] cursor-pointer touch-manipulation">
            Texto
        </button>
        <button id="btn-share-card" data-i18n="btnShareCard" class="hidden">
            Tarjeta (16:9)
        </button>
    </div>
</section>
